# Publica K-POS en Cloudflare (workers.dev o tu dominio).
# Secretos del repositorio necesarios (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con permisos: Workers Scripts (edit), D1 (edit), Account Settings (read)
#   CLOUDFLARE_ACCOUNT_ID  id de tu cuenta de Cloudflare
#   D1_DATABASE_ID         id de la base creada con `npx wrangler d1 create k-pos`
name: Publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Comprobar configuración de publicación
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$D1_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publicación omitida: configura los tres secretos de Cloudflare indicados en docs/PUBLICAR.md."
          fi
      - name: Configurar base de datos
        if: steps.config.outputs.ready == 'true'
        run: sed -i "s/REEMPLAZAR_CON_ID_DE_D1/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
      - name: Versión de la app (los dispositivos se actualizan solos)
        if: steps.config.outputs.ready == 'true'
        run: sed -i "s/const VERSION = '[^']*'/const VERSION = 'kpos-${GITHUB_SHA::8}'/" public/sw.js
      - name: Migraciones D1
        if: steps.config.outputs.ready == 'true'
        run: npx --no-install wrangler d1 migrations apply k-pos --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar Worker
        if: steps.config.outputs.ready == 'true'
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
