<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-POS · Clientes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    .row-actions { display: flex; gap: .3rem; flex-wrap: wrap; }
    td small { color: var(--muted); display: block; }
    .st-active { color: var(--green); font-weight: 700; }
    .st-suspended { color: var(--red); font-weight: 700; }
    .st-trial { color: var(--amber); font-weight: 700; }
    .due { color: var(--red); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="view-head"><div><a class="admin-back" href="/">← Volver al POS</a><h1>Clientes y negocios</h1><p class="muted">Administra pruebas, clientes oficiales y accesos desde K-POS.</p></div><div class="actions admin-actions">
      <button class="btn primary" id="create" hidden>＋ Nuevo cliente</button><button class="btn" id="plans" hidden>Paquetes</button><button class="btn" id="reload" hidden>Actualizar</button><button class="btn ghost" id="logout" hidden>Salir</button></div></div>
    <form id="login" class="panel form" hidden>
      <label for="admin-key">Clave de superadministrador</label><input id="admin-key" type="password" name="key" autocomplete="current-password" required autofocus>
      <div class="actions left"><button class="btn primary">Entrar</button></div>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div class="toolbar" id="filters" hidden><div class="search"><input id="client-search" aria-label="Buscar clientes" type="search" placeholder="Buscar negocio, cuenta o correo…"></div><select id="client-status" aria-label="Filtrar clientes por estado"><option value="all">Todos los estados</option><option value="trial">Pruebas</option><option value="active">Activos</option><option value="suspended">Suspendidos</option><option value="balance">Con saldo pendiente</option><option value="expired">Servicio vencido</option></select></div>
    <div id="kpis" class="kpis"></div>
    <p id="commercial-summary" class="muted" hidden></p>
    <div class="table-wrap"><table class="data" id="list"></table></div>
  </div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
