name = "k-pos"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"
# Sin dominio propio: se publica en https://k-pos.<tu-cuenta>.workers.dev
workers_dev = true

# La PWA (carpeta public/) se sirve como archivos estáticos; /api/* lo atiende el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "k-pos"
database_id = "REEMPLAZAR_CON_ID_DE_D1"
migrations_dir = "worker/migrations"

# Tiempo real: un Durable Object por negocio avisa a sus dispositivos cuando hay cambios.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "TenantLive"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantLive"]

# Cada hora: el Worker revisa qué negocios están en su hora de resumen (según su zona horaria).
[triggers]
crons = ["0 * * * *"]

[vars]
# Dominio raíz (opcional). Vacío = todos los negocios entran por la misma dirección (workers.dev)
# y se identifican por su cuenta al vincular. Con dominio: ROOT_DOMAIN = "kpos.mx" → rockalitas.kpos.mx
ROOT_DOMAIN = ""
TELEGRAM_BOT_USERNAME = ""

# Secretos (wrangler secret put ...):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_KEY
#   RESEND_API_KEY (opcional, para recuperar contraseña por correo) y MAIL_FROM
#
# Subdominios: en el dashboard de Cloudflare agrega un registro DNS comodín (*.kpos.mx)
# y una ruta del Worker, o descomenta:
# routes = [
#   { pattern = "kpos.mx/*", zone_name = "kpos.mx" },
#   { pattern = "*.kpos.mx/*", zone_name = "kpos.mx" },
# ]
